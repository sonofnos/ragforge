services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragforge
    ports:
      - "5432:5432"
    volumes:
      - ragforge_pg:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ragforge_mongo:/data/db

volumes:
  ragforge_pg:
  ragforge_mongo:
